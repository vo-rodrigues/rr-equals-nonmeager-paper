name = "nonm_rr"
version = "0.1.0"
description = "A mathlib formalization of non(M) <= rr."
license = "Apache-2.0"
keywords = ["math", "set-theory", "cardinal-characteristics"]
defaultTargets = ["NonMRR", "AxiomAudit"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "NonMRR"

[[lean_lib]]
name = "AxiomAudit"
