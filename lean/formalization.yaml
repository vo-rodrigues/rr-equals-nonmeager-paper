# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: "The rearrangement number: non(M) ≤ rr"
  description: >-
    A Lean formalization of the lower bound non(M) ≤ rr, where non(M) is the
    least cardinality of a nonmeagre subset of the usual real line and rr is
    the least cardinality of a family of permutations of the natural numbers
    that changes the sum or destroys convergence of every conditionally
    convergent real series.
    It accompanies the manuscript *Determining the Rearrangement Number* by Vinicius de Oliveira Rodrigues.
    The reverse inequality was already known in the literature.
    The reverse inequality, the full equality, and further manuscript
    corollaries are not formalized in this project.
  authors:
    - Vinicius de Oliveira Rodrigues
  responsible_maintainers:
    - Vinicius de Oliveira Rodrigues
  license: Apache-2.0
classification:
  arxiv: [math.LO]
  msc2020: [03E17, 40A05]
sources:
  - title: Determining the Rearrangement Number
    authors: [Vinicius de Oliveira Rodrigues]
    type: paper
    location: "https://github.com/vo-rodrigues/rr-equals-nonmeager-paper/tree/241c930bbf257f1c8304c39d3253fa4f8a1a6a89/paper"
    relationship: formalizes
    license: CC-BY-4.0
    note: >-
      Main Theorem 1.2, lower-bound direction; finite estimate and block
      construction in Sections 3–4. The pinned manuscript is included in
      paper/ in this repository. See docs/MANUSCRIPT.md for correspondence.
status:
  scope: >-
    Complete lower bound non(M) ≤ rr and attainment of the two defining
    minima. Excludes rr ≤ non(M), the equality, and Section 5 corollaries.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: ["OpenAI GPT-6 Astra"]
      framework: OpenAI Codex
      tool_setup: >-
        AI-generated Lean formalization, checked with Lean 4.30.0 and pinned
        mathlib. Codex also prepared the Palomar statement, solution wrappers,
        metadata, and transitive axiom guards.
  notes: >-
    The repository's paper/README.md records that the formalization was fully
    generated by OpenAI's GPT-6 Astra. Vinicius de Oliveira Rodrigues is the
    manuscript author and responsible human maintainer.
fidelity:
  divergences: >-
    Only the rr ≤ non(M) inequality is formalized. The Lean proof supplies its
    classical ingredients and uses the proof organization described in
    docs/MANUSCRIPT.md. No extra hypotheses occur in the submitted inequality.
    Ordered convergence uses SummationFilter.conditional rather than
    unconditional Summable. Challenge has three intentional theorem holes;
    status counts refer to the proved development and exclude those holes.
review:
  status: author-verified
  reviewers: [Vinicius de Oliveira Rodrigues, OpenAI Codex]
  notes: >-
    Vinicius de Oliveira Rodrigues reviewed the formal statement and checked
    that it correctly represents the formalized mathematical result. Codex
    reviewed the submission statements against the existing definitions and
    proof entry points and added axiom guards for all compared theorems.
    Existing verification and manuscript correspondence are recorded in
    docs/VERIFICATION.md and docs/MANUSCRIPT.md. This does not claim
    independent peer review or a completed Palomar review. See docs/PALOMAR.md
    for the checks actually run and remaining external verification.
alignment:
  namespace: PalomarRR
  statements:
    - source: "Main Theorem 1.2, lower-bound direction"
      lean: PalomarRR.nonM_le_rr
      module: Solution
      status: proved
      note: "Uses NonMRR.nonM_le_rr; the reverse inequality is outside scope."
    - source: "Definitions of non(M) and rr as least cardinalities"
      lean: PalomarRR.nonM_minimum
      module: Solution
      status: proved
      note: "Attainment for nonmeagre subsets of the real line."
    - source: "Definitions of non(M) and rr as least cardinalities"
      lean: PalomarRR.rr_minimum
      module: Solution
      status: proved
      note: "Attainment for rearranging families of permutations of ℕ."
